<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定ページ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>まもる君だよ！！</h1>

  <h2 id="site">設定ページ</h2>
  <ul id="enviroments">
  </ul>
  
  <h2>共通設定</h2>
  <ul id="common-settings">
    <li>
      <label for="obi-size">帯サイズ（px）：</label>
      <input type="number" class="common-input" id="obi-size" maxlength="5">
    </li>
  </ul>

  <div class="center">
    <button class="settings">その他の設定</button>
  </div>
  
  <div id="mamorukun-container">
    <input type="checkbox" class="common-input" id="mamorukun-destroy">
    <label for="mamorukun-destroy">まもる君を消す</label>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
